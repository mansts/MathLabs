name: Research-1 tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Research-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy pytest matplotlib

      - name: Run physics tests
        env:
          PYTHONPATH: .
        run: python -m pytest -vv

      - name: Run first experiment
        env:
          PYTHONPATH: .
        run: python run_experiment.py

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-1-results
          path: Research-1/results/
          if-no-files-found: error
